<!-- alerts.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time MTA Alerts</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Real-Time MTA Alerts</h1>
        <a href="{% url 'maps:map_view' %}"><button class="btn btn-primary mb-4">Return to Map</button></a>

        <!-- Alerts container to be updated with AJAX -->
        <div id="alerts-container">
            {% include "app/alerts_content.html" %}
        </div>
    </div>

    <script>
        // Function to fetch alerts and update the content
        function fetchAlerts() {
            $.ajax({
                url: '{% url "app:alerts" %}', // Use Django's URL template tag
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    console.log("Full response:", response);

                    if (response.alerts_data && response.alerts_data.length > 0) {
                        $('#alerts-container').html('');

                        let alertContent = '<div class="list-group">';
                        response.alerts_data.forEach(function(alert) {
                            alertContent += `
                            <div class="list-group-item mb-3">
                                <h4>${alert.header}</h4>
                                ${alert.description ? `<p>${alert.description}</p>` : ''}
                            </div>
                            `;
                        });
                        alertContent += '</div>';

                        $('#alerts-container').html(alertContent);
                    } else {
                        console.log("No alerts available in response.");
                        $('#alerts-container').html('<p>No alerts available at the moment. Please check back later.</p>');
                    }
                },
                error: function(error) {
                    console.log("Error fetching alerts data", error);
                }
            });
        }

        // Fetch alerts when the page loads
        $(document).ready(function() {
            fetchAlerts();
            // Set an interval to refresh alerts every 10 seconds (10000 milliseconds)
            setInterval(fetchAlerts, 10000);
        });
    </script>
</body>
</html>
